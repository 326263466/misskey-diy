#    # Misskey applies a restricted default: no user info, no cookies, no URL
#    # query params (they may carry an access token), no HTTP bodies, no DB
#    # query values, and peer-identifying request/response headers denied.
#    # To change what is collected, set `dataCollection` here. It replaces
#    # Misskey's default as a whole, so `dataCollection: {}` restores Sentry's
#    # own defaults and collects everything.
#    #dataCollection:
#    #  userInfo: true

#sentryForFrontend:
