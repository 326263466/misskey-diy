#   ┌─────────────────────┐
#───┘ Other configuration └─────────────────────────────────────

# Whether disable HSTS
#disableHsts: true

# Enable internal IP-based rate limiting (default: true)
# To configure them in reverse proxy instead, set this to false.
#enableIpRateLimit: true

# Number of worker processes
#clusterLimit: 1

# Number of threads of extra thread pool for CPU-intensive tasks (per worker)
#threadPoolSize: 1

# Job concurrency per worker
#deliverJobConcurrency: 128
#inboxJobConcurrency: 16
#relationshipJobConcurrency: 16
# What's relationshipJob?:
#  Follow, unfollow, block and unblock(ings) while following-imports, etc. or account migrations.

# Job rate limiter
#deliverJobPerSec: 128
#inboxJobPerSec: 32
#relationshipJobPerSec: 64

# Job attempts
#deliverJobMaxAttempts: 12
#inboxJobMaxAttempts: 8

# Local address used for outgoing requests
#outgoingAddress: 127.0.0.1

# IP address family used for outgoing request (ipv4, ipv6 or dual)
#outgoingAddressFamily: ipv4

# Proxy for HTTP/HTTPS
#
# IMPORTANT: When a proxy is configured, Misskey does NOT check whether
# the destination of outgoing requests (remote ActivityPub objects,
# media proxy, URL previews, file uploads from URL, webhooks, etc.) is
# a private / loopback / link-local address, because the connection is
# made to the proxy rather than to the destination itself.
# `allowedPrivateNetworks` is also not applied to proxied requests.
# In that case, filtering of destinations is entirely delegated to the
# proxy, so you MUST configure the proxy to deny access to internal
# networks (e.g. RFC 1918, loopback, link-local, and cloud metadata
# addresses such as 169.254.169.254).
# Hosts listed in `proxyBypassHosts` are connected to directly without
# going through the proxy. Depending on the type of request, Misskey's
# own private address check may not be applied to these connections,
# so only list hosts you trust here.
#
#proxy: http://127.0.0.1:3128

proxyBypassHosts:
  - api.deepl.com
  - api-free.deepl.com
  - www.recaptcha.net
  - hcaptcha.com
  - challenges.cloudflare.com

# Proxy for SMTP/SMTPS
#proxySmtp: http://127.0.0.1:3128   # use HTTP/1.1 CONNECT
#proxySmtp: socks4://127.0.0.1:1080 # use SOCKS4
#proxySmtp: socks5://127.0.0.1:1080 # use SOCKS5

# Media Proxy
# Reference Implementation: https://github.com/misskey-dev/media-proxy
# * Deliver a common cache between instances
# * Perform image compression (on a different server resource than the main process)
#mediaProxy: https://example.com/proxy

# Movie Thumbnail Generation URL
# There is no reference implementation.
# For example, Misskey will point to the following URL:
#   https://example.com/thumbnail.webp?thumbnail=1&url=https%3A%2F%2Fstorage.example.com%2Fpath%2Fto%2Fvideo.mp4
#videoThumbnailGenerator: https://example.com

# For security reasons, uploading attachments from the intranet is prohibited,
# but exceptions can be made from the following settings. Default value is "undefined".
# Read changelog to learn more (Improvements of 12.90.0 (2021/09/04)).
#allowedPrivateNetworks:
#  - '127.0.0.1/32'

# Upload or download file size limits (bytes)
#maxFileSize: 262144000

# PID File of master process
#pidFile: /tmp/misskey.pid

# Log settings
# logging:
#   # Log output format. "json" outputs one-line JSON; defaults to "pretty".
#   format: pretty
#   # Minimum level for all loggers. Defaults to info in production and debug otherwise.
#   level: info
#   # The longest matching logger domain takes precedence over the global level.
#   domains:
#     core.boot: info
#     queue: error
#     queue.deliver: debug
#     db.sql: off
#   # HTTP status classes to record in the access log. No output when unspecified.
#   access:
#     statusClasses:
#       - '2xx'
#       - '3xx'
#       - '4xx'
#       - '5xx'
#     # Enable body logging explicitly only during development.
#     bodies:
#       request: false
#       response: false
#       # 16 KiB by default, up to 128 KiB.
#       maxBytes: 16384
#   sql:
#     # Outputs query parameters during SQL execution to the log.
#     # default: false
#     enableQueryParamLogging: false
#     # Disable query truncation. If set to true, the full text of the query will be output to the log.
#     # default: false
#     disableQueryTruncation: false
