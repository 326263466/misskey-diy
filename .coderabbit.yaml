language: "zh-CN"
tone_instructions: "请始终使用礼貌、尊重的表达。避免评价个人或能力，避免讽刺、施压或命令式的语气。指出问题时说明问题本身及其影响，简要给出理由，并提出具体的改进建议。不确定的内容请注明是推测并建议确认。严重的缺陷或安全隐患请明确说明严重程度和依据。"
reviews:
  profile: "chill"
  high_level_summary: false
  poem: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "develop"
    ignore_title_keywords:
      - "New Crowdin updates"
    ignore_usernames:
      - "dependabot[bot]"
      - "renovate[bot]"
      - "github-actions[bot]"
  path_instructions:
    - path: "**/*"
      instructions: |
        【不在审查范围内】
        - 格式违规、类型错误、SPDX 头缺失等可由静态分析发现的问题，已由其他 Workflow（CI/CD）检查，请忽略，不作为审查对象。

        【需要特别处理的审查】
        - 在 PR 未改动的部分中，若发现对照 PR 标题和说明属于范围外、但仍应修复的问题，请不要要求在本 PR 中修复，而是指示另开一个 PR 处理。\
          但如果本 PR 增删代码行可能引发范围外的问题，则例外地要求在本 PR 中修复。

        【请重点关注的方面】
        - 请聚焦于业务逻辑缺陷、安全、性能以及设计模式是否恰当等方面进行审查。
        - 请审查是否包含对照 PR 标题和说明属于范围外的改动。仅针对能确信明显属于范围外的情况（例如：编辑了完全无关的文件），难以判断是否属于范围外时请不要指出。\
          若包含范围外的改动，请指出，并指示将该部分从本 PR 中移出、另开 PR 进行修改。
  path_filters:
    - "!CHANGELOG.md"
    - "!**/__snapshots__/**"
